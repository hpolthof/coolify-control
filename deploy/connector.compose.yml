services:
  coolify-control-connector:
    image: ${CONNECTOR_IMAGE:-ghcr.io/hpolthof/coolify-control-connector:latest}
    network_mode: host
    user: "9999:9999"
    restart: unless-stopped
    # The connector (~30 MB) plus one cloudflared process per Cloudflare Tunnel server.
    mem_limit: 256m
    env_file: .env
    volumes:
      - /data/coolify/ssh/keys:/keys:ro
